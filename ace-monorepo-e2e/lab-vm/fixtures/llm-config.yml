    docs-analysis: ["pi:zai/glm-5.3-flash:high"]
    compressor: ["pi:zai/glm-5.3-flash:high"]
    idea-enhance: ["pi:zai/glm-5.3-flash:high@ro"]
    sim-primary: ["pi:zai/glm-5.3-flash:high@ro"]
    sim-synthesis: ["pi:zai/glm-5.3-flash:high"]
