test-id: TS-MONO-002
title: "Quick-Start Local Validation"
area: monorepo
package: ace-monorepo-e2e
priority: high
tags: [quickstart, docs-verify, happy-path, setup-contract]
cost-tier: happy-path
tool-under-test: ace-config

sandbox-layout:
  results/tc/01/: "Idea capture evidence (file creation, list output)"
  results/tc/02/: "Task creation evidence (file creation, show output)"
  results/tc/03/: "Protocol navigation evidence (workflow list, bundle output)"
  results/tc/04/: "Config cascade evidence (override takes precedence)"
  results/tc/05/: "Fresh setup path evidence (.ace-local ignore, providers, doctor, aliases)"
  results/tc/06/: "First setup commit and deterministic -m fallback evidence"

e2e-justification: >
  Validates that the documented quick-start steps in docs/quick-start.md
  produce the claimed outcomes when executed by a new user, including fresh
  setup checks and commit fallback guidance from issue #298. Requires real CLI
  execution in a sandbox with real filesystem and git state. Catches docs drift
  where documented setup and fallback commands no longer work as described.

e2e-evidence-strength: command-output
e2e-false-positive-risk: low

unit-coverage-reviewed:
  - ace-idea/test/fast/commands/idea_cli_test.rb
  - ace-task/test/fast/commands/create_test.rb
  - ace-bundle/test/feat/cli_preset_composition_test.rb

requires:
  tools: [ace-idea, ace-task, ace-bundle, ace-nav, ace-search, ace-config, ace-handbook, ace-git-commit, ace-llm, git]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: |
      cat >> .git/info/exclude <<'EOF'
      .gitignore
      .ace/git/
      .ace/llm/
      .ace/bundle/
      .ace-handbook/
      .ace-ideas/
      .ace-tasks/
      docs/
      mise.toml
      quick-start.md
      EOF
  - run: |
      # Copy the minimal tracked repo context that quick-start references.
      source_root="${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}"
      mkdir -p .ace docs
      cp "$source_root/.gitignore" .gitignore
      cp -R "$source_root/.ace/bundle" .ace/
      cat > .ace/bundle/config.yml <<'EOF'
      # Sandbox override for deterministic E2E bundle execution.
      bundle:
        max_lines: 2100
        compressor:
          source_scope: "off"
          mode: "exact"
      EOF
      for doc in vision.md architecture.md decisions.md ace-gems.g.md blueprint.md tools.md; do
        cp "$source_root/docs/$doc" "docs/$doc"
      done
  - run: "cp ${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml mise.toml && mise trust mise.toml"
  - run: |
      # Copy the quick-start doc into sandbox for reference
      cp "${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/docs/quick-start.md" quick-start.md
  - run: |
      # Follow quick-start steps 3-4: sync CLI provider config and handbook assets
      ace-config sync ace-llm-providers-cli
      ace-handbook sync
  - agent-env:
      PROJECT_ROOT_PATH: .
