# ace-lab default configuration
# Override in ~/.ace/lab/config.yml or .ace/lab/config.yml
#
# Deployed topology values are owned by the lab-config repository; this
# default ships a deliberately empty, safe structure so a fresh install
# resolves to "no topology" instead of guessed values.
#
# AUTHORIZATION GRANTS DO NOT LIVE HERE. Caller-writable cascade documents
# must never define who may see what (review round 4, F3). Grants come from
# the single deployment-controlled file /etc/lab/ace-lab/authorization.yml —
# a fixed path; the file and every directory on its real path must be
# root-owned and not group/world-writable, or queries fail closed:
#
#   { "principals": { "<verified-local-uid>": { "projects": ["project-id"] } } }
#
# Topology schema (version 1):
#   topology:
#     projects:
#       - { id: project-id, label: Display name }
#     agents:
#       - id: agent-id
#         project: project-id
#         role: planner
#         capabilities: ["planning"]
#         binding: { kind: runtime, state: active, instance_id: iid,
#                    attested_instance_id: iid }
#     services:
#       - id: service-id
#         project: project-id
#         capabilities: ["search"]
#         default_for: ["search"]
#         endpoint: { kind: http, url: "https://service.example/internal" }
#         binding: { kind: service, state: active, instance_id: iid,
#                    attested_instance_id: iid }

schema_version: 1

topology:
  projects: []
  agents: []
  services: []
