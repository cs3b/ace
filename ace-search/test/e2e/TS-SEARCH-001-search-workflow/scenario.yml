test-id: TS-SEARCH-001
title: "ace-search Core Search Workflow"
timeout: 900
area: search
package: ace-search
priority: medium
cost-tier: smoke
tags: [smoke, "use-case:search"]
tool-under-test: ace-search

sandbox-layout:
  results/tc/01/: "Content-search artifacts"
  results/tc/02/: "File-search artifacts"
  results/tc/03/: "Count/list artifacts"
  results/tc/04/: "JSON-output artifacts"
  results/tc/05/: "Preset-driven artifacts"
  results/tc/06/: "Git-scope artifacts"

e2e-justification: >
  Requires real ripgrep-backed execution across content, file, count/list,
  JSON output, preset invocation, and git-scoped modes through the public CLI
  with user-visible outcome verification.

unit-coverage-reviewed:
  - test/feat/cli_integration_test.rb
  - test/fast/molecules/search_option_builder_test.rb
  - test/fast/organisms/result_formatter_test.rb

requires:
  tools: [ace-search, rg]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "if [ -f \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" ]; then cp \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" mise.toml && mise trust mise.toml; fi"
