# Bug fix workflow: onboard → fix → verify → PR → review
# Usage: /as-assign-prepare fix-bug --taskref 123

name: fix-bug
description: Fix an issue, verify tests, and create a reviewed PR

parameters:
  taskref:
    required: true
    description: Task reference for the bug fix (e.g., 123 or 256.01)

steps:
  - name: onboard
    skill: as-onboard
    instructions:
      - Onboard yourself to the codebase.
      - Load context and understand the project structure.

  - name: work-on-task
    skill: as-task-work
    instructions:
      - "First: onboard yourself using /as-onboard skill to load project context."
      - "Fix the issue described in task {{taskref}}."
      - Follow the bug fix workflow: analyze → reproduce → fix → test.

  - name: mark-task-done
    instructions:
      - "Mark task {{taskref}} as done."
      - "Run: ace-task update {{taskref}} --set status=done --move-to archive"
      - "Commit the archive file moves: `ace-git-commit .ace-tasks/ -i 'archive completed task'`"

  - name: verify-test-suite
    workflow: wfi://assign/verify-test-suite
    instructions:
      - Run `ace-test <package> all --profile 6` for each modified package first.
      - Then run `ace-test-suite --target all` to verify the fix does not break the wider deterministic suite.
      - Ensure all required checks pass before continuing.

  - name: create-pr
    skill: as-github-pr-create
    instructions:
      - Create a pull request for the bug fix.
      - Create it as a draft with --draft; mark it ready only after the review completion rule is met.
      - Include reference to the bug/task in the PR description.

  - name: review-pr
    workflow: wfi://review/pr
    instructions:
      - "Follow wfi://review/pr: minimum 3 completed PR rounds, last 2 without confirmed P0/P1. Include integration within those rounds."
      - "Verify findings, fix concrete defects, and run appropriate tests. Record rounds and dispositions; commits do not reset counters."

  - name: update-pr-desc
    workflow: wfi://github/pr/update
    instructions:
      - "Record the review rounds, actual reviewers, findings and tests in the PR description before marking it ready."

  - name: mark-pr-ready
    instructions:
      - "After review completes and appropriate tests pass, run `gh pr ready` on the draft PR."

customization_hints:
  - "Add fix-tests after verify-test-suite if failures found"
  - "Add security-audit for security-related fixes"
  - "Use more focused scopes for critical fixes; continue until important findings are resolved"
