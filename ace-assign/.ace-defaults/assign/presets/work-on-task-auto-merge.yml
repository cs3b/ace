# work-on-task-auto-merge preset
# Advanced authorized guarded auto-merge task delivery preset

name: work-on-task-auto-merge
description: Work on a task with PR, converging review rounds, and advance authorization for guarded auto-merge

parameters:
  forge_server:
    required: false
    type: string
    description: Named configured forge; mutually exclusive with forge_default
  forge_default:
    required: false
    type: boolean
    description: Explicitly select the configured default forge
  pr_provenance:
    required: false
    type: object
    description: Explicit mode, head_repository_url, head_ref, base_repository_url and base_ref; required before remote delivery
  taskrefs:
    required: true
    type: array
    description: Task references

steps:
  - name: onboard
    number: "000"
    workflow: wfi://onboard
    instructions:
      - "Load project context for the task: {{taskrefs}}."

  - name: create-pr
    number: "030"
    workflow: wfi://git/pr/create
    instructions:
      - "Create a pull request summarizing task: {{taskrefs}}."
      - "Create it as a draft with --draft; mark it ready only after the review completion rule is met."

  - name: push-to-remote
    number: "140"
    instructions:
      - Push changes with force-with-lease.

  - name: mark-tasks-done
    number: "142"
    workflow: wfi://task/update
    instructions:
      - "Mark task {{taskrefs}} done and commit tracked task-file changes before review."

  - name: review-pr
    number: "145"
    workflow: wfi://review/pr
    instructions:
      - "Follow wfi://review/pr: minimum 3 completed PR rounds, last 2 without confirmed P0/P1. Include integration within those rounds."
      - "Verify findings, fix concrete defects, and run appropriate tests. Record rounds and dispositions; commits do not reset counters."

  - name: update-pr-desc
    number: "147"
    workflow: wfi://git/pr/update
    instructions:
      - "Record the review rounds, actual reviewers, findings and tests in the PR description before marking it ready."

  - name: mark-pr-ready
    number: "148"
    instructions:
      - "After review completes and appropriate tests pass, run `ace-assign delivery --assignment ID --attempt ATTEMPT --operation ready --tests TEST-REF --review REVIEW-REF` with accepted exact-head test and independent review references."

  - name: auto-merge
    number: "150"
    instructions:
      - "Merge only when separately authorized and the existing merge checks pass."
