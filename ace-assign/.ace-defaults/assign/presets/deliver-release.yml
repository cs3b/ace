# Prepare a stable release cut from an explicitly accepted producer set.
# Usage: ace-assign create --task TASK[,TASK...] --preset deliver-release

name: deliver-release
description: Prepare and bind a stable release cut without exercising publication authority

parameters:
  taskrefs:
    required: true
    type: array
    description: Producer task references contributing to the accepted release source set

steps:
  - name: bind-release-cut
    number: "010"
    instructions: |
      From producer task references {{taskrefs}}, record one immutable release manifest
      containing the exact accepted source set (repository/ref and commit SHA for every
      member), every package name and version, every artifact digest with algorithm,
      the decision actor and timestamp, and the policy/plan revision plus evidence
      references that accepted the cut. Reject incomplete or ambiguous bindings.
      Once accepted, do not add later merges or silently replace a source, version, or
      artifact; make a new release-cut decision instead.

  - name: verify-release-evidence
    number: "020"
    instructions: |
      Verify tests and independent review are current for every exact source head in the
      manifest. Reconcile target movement and provenance before preparation. A moved or
      rebuilt source requires renewed evidence and a newly bound artifact digest.

  - name: prepare-release-artifacts
    number: "030"
    instructions: |
      Perform only project-authorized local release preparation. Build artifacts from
      the bound source set, verify the declared package name and version, compute the
      final artifact digest, and update the manifest before it is accepted. Preparation
      is not publication, installation, deployment, or proof of any of those effects.

  - name: publication-authority-placeholder
    number: "040"
    instructions: |
      Publication placeholder only. Do not run a publish command in this preset. Route
      the exact manifest to the separate publication authority named by project policy.
      Missing credentials, publisher identity, or admission is
      BLOCKED(provision, owner). If that authority accepts a request and returns a
      durable operation reference plus reconciliation path, record
      WAIT(reference, next-check); otherwise preserve uncertainty and do not retry.

  - name: record-release-outcome
    number: "050"
    instructions: |
      Record only attributable publication, installation, or deployment receipts from
      their owning authorities, each bound to the exact manifest. Host-owned root
      effects remain referenced external operations. Keep later merges outside this
      release outcome.

