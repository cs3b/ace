# work-on-task-ace-development preset
# Complete ACE framework development pipeline preset (batching, releases, demo recording, retro)

name: work-on-task-ace-development
description: Full ACE development pipeline with batching, releases, demo recording, and retrospectives

parameters:
  taskrefs:
    required: true
    type: array
    description: Task references

steps:
  - name: onboard
    number: "000"
    workflow: wfi://onboard
    instructions:
      - "Load project context for the task batch: {{taskrefs}}."

  - name: verify-test-suite
    number: "012"
    workflow: wfi://assign/verify-test-suite
    instructions:
      - "Verify test coverage and performance across batch tasks: {{taskrefs}}."

  - name: release-minor
    number: "020"
    instructions:
      - Release all modified packages touched by this batch.

  - name: create-pr
    number: "030"
    workflow: wfi://github/pr/create
    instructions:
      - "Create a pull request summarizing batch tasks: {{taskrefs}}."
      - "Create it as a draft with --draft; mark it ready only after the review completion rule is met."

  - name: record-demo
    number: "145"
    instructions:
      - "Record a demo showing the feature implemented in this PR."

  - name: mark-tasks-done
    number: "146"
    workflow: wfi://task/update
    instructions:
      - "Mark each top-level task in {{taskrefs}} as done and archive it before review."

  - name: create-retro
    number: "147"
    skill: as-retro-create
    instructions:
      - "Create a retrospective for the batch work on: {{taskrefs}}."

  - name: review-pr
    number: "148"
    workflow: wfi://review/pr
    instructions:
      - "Follow wfi://review/pr: minimum 3 completed PR rounds, last 2 without confirmed P0/P1. Include integration within those rounds."
      - "Verify findings, fix concrete defects, and run appropriate tests. Record rounds and dispositions; commits do not reset counters."

  - name: update-pr-desc
    number: "149"
    workflow: wfi://github/pr/update
    instructions:
      - "Record the review rounds, actual reviewers, findings and tests in the PR description before marking it ready."

  - name: mark-pr-ready
    number: "150"
    instructions:
      - "After review completes and appropriate tests pass, run `gh pr ready` on the draft PR."
