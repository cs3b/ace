# Close only an accepted delivery scope after preservation and writer checks.
# Usage: ace-assign create --task TASK[,TASK...] --preset close-delivery

name: close-delivery
description: Preserve delivery evidence and work, prove quiescence, and close only accepted delivery scope

parameters:
  taskrefs:
    required: true
    type: array
    description: Producer task references whose accepted delivery scope is being closed

steps:
  - name: preserve-delivery-record
    number: "010"
    instructions: |
      For producer task references {{taskrefs}}, preserve accepted evidence and work
      before any cleanup: exact source heads, decision records, tests, independent
      review, integration/release manifests, operation references, callbacks, receipts,
      blockers, and uncertain effects. Verify the durable destinations and retain the
      delivery tag and producer references so archived delivery remains discoverable.
      Do not change producer task status or reparent producer tasks.

  - name: verify-no-surviving-writers
    number: "020"
    instructions: |
      Execute current canonical status checks for every assignment, attempt, worker,
      reviewer, integrator, publisher, callback handler, worktree, and other scoped
      actor. Require positive evidence of no surviving writers. Missing, unreadable,
      active, or uncertain lifecycle state blocks closure and cleanup; a quiet terminal
      or completed worker is not proof.

  - name: verify-accepted-scope
    number: "030"
    instructions: |
      Compare the requested closure against the accepted delivery scope and project
      decision record. Confirm every intended outcome has an attributable accepted
      receipt and every excluded, deferred, blocked, or uncertain item remains visible.
      Close only the accepted delivery scope; never close producer work, unrelated
      delivery tasks, or a broader release because one path succeeded.

  - name: reference-host-operations
    number: "040"
    instructions: |
      Preserve references to host-owned root installation, deployment, service, and
      cleanup operations. This preset neither performs nor claims those effects. A
      missing root receipt remains attributable to the host owner and blocks only the
      scope that requires it.

  - name: close-accepted-delivery
    number: "050"
    instructions: |
      After preservation, no-surviving-writers proof, and full accepted-scope
      reconciliation, close and archive only this delivery record through the existing
      task/Assign owner. Preserve the delivery tag, producer references, and evidence
      links. Do not infer implementation-parent or producer task status changes.

