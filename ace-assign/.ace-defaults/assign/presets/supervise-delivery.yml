# Delivery queue supervision over existing producer tasks.
# Usage: ace-assign create --task TASK[,TASK...] --preset supervise-delivery

name: supervise-delivery
description: Supervise dependency-aware integration and release decisions for several PR-ready producer tasks

parameters:
  taskrefs:
    required: true
    type: array
    description: Existing producer task references to observe as delivery queue entries

steps:
  - name: reconcile-delivery-queue
    number: "010"
    instructions: |
      Reconcile the current canonical Assign attempts, task evidence, candidate heads,
      dependency state, and project delivery guide for producer task references:
      {{taskrefs}}.

      These are references to producer tasks; never reparent, duplicate, reopen, or
      change producer task status. A PR-ready worker remains terminal even while this
      delivery assignment stays open. A local objective queue may store goals, next actions, blockers and references;
      no second execution queue, journal, daemon, or cache may be created. Treat an empty observation as current input only: Transiently empty
      is not accepted completion.

  - name: supervise-delivery-queue
    number: "020"
    instructions: |
      Act as the one running supervisory step for producer task references {{taskrefs}}.
      Apply the resolved project decision guide to dependency readiness, integration
      grouping, evidence freshness, release/demo/production policy, and available
      authority. Integration order follows dependencies and policy, never completion
      order or worker finish timestamps.

      Before every integration effect, write a canonical step report containing all
      mandatory decision-record fields:
      - ordered eligible set;
      - selected next entry;
      - deferred entries, with a reason for every skipped candidate;
      - decision actor and timestamp;
      - policy/plan revision and evidence references used for the decision.

      For every entry, evaluate dependency state, exact candidate head SHA, fresh
      tests, initial independent review and a documented accepted-head assessment.
      An identical rebase needs executed content-identity proof; a minor safe correction
      needs integrator reasoning and tests; material or uncertain delta needs independent
      delta review. Evaluate required authority, transport and grouping constraints. Re-record the decision after dependency,
      candidate head, evidence, authority, transport, or target-branch movement.

  - name: reconcile-integration-operation
    number: "030"
    instructions: |
      Reconcile each requested integration through its original canonical operation.
      Use WAIT(reference, next-check) only after an authorized request has a durable
      operation reference and an exact public poll/reconcile path. Use
      BLOCKED(provision, owner) when authority, transport, provisioning, or the durable
      result path is absent. A lost or uncertain response without a durable path is
      BLOCKED with the responsible host owner; never invent WAIT and never blindly
      repeat launch, merge, publication, or deployment.

  - name: decide-delivery-continuation
    number: "040"
    instructions: |
      Record the explicit project-policy decision to integrate more candidates, cut a
      release from the current accepted set, deploy through a separately authorized
      project workflow, or keep this delivery open. Preserve callbacks and resume from
      canonical state. Producer completion alone never closes this assignment.

