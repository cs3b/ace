name: auto-merge
description: Merge an authorized exact-head candidate with the existing merge checks
instructions: |
  Merge only when separately authorized and the existing merge checks pass.
  Resolve fresh repository, candidate exact head, target branch, executed tests
  and independent review for that exact head immediately before the effect.
  Use the configured forge command:
  ace-git pr merge IDENTIFIER --expected-head CANDIDATE-SHA --method METHOD --format json
  with the retained server/default/remote selection. The authorized squash,
  merge or rebase method is required. Never push directly to main. On an
  uncertain effect reconcile the original operation; never blindly retry.
