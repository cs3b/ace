name: mark-pr-ready
description: Mark a reviewed draft pull request ready after the review completion rule
instructions: "After the review completion rule is met and appropriate tests have passed on the exact head, record the executed tests and independent review evidence for that head, then mark the draft PR ready with the configured forge command: ace-git pr ready IDENTIFIER --expected-head HEAD. Keep the retained server/default/remote selection. Readiness requires current-head evidence; the low-level command does not establish it."
prerequisites:
  - name: review-pr
    strength: required
    reason: Review must complete before marking the PR ready
  - name: update-pr-desc
    strength: required
    reason: The PR description must record the review rounds, reviewer roster, tests, and dispositions before readiness
consumes: [review-feedback]
