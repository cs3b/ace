name: mark-pr-ready
description: Mark a reviewed draft pull request ready after the review completion rule
instructions: "After the review completion rule is met and appropriate tests have passed, run ace-assign delivery --assignment ID --attempt ATTEMPT --operation ready --tests TEST-REF --review REVIEW-REF with accepted exact-head evidence."
prerequisites:
  - name: review-pr
    strength: required
    reason: Review must complete before marking the PR ready
  - name: update-pr-desc
    strength: required
    reason: The PR description must record the review rounds, reviewer roster, tests, and dispositions before readiness
consumes: [review-feedback]
