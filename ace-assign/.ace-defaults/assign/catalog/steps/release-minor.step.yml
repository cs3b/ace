name: release-minor
description: Prepare modified package versions and CHANGELOGs; publication is separate

prerequisites:
  - name: verify-test
    strength: recommended
    reason: "Verify changes are stable before releasing subtree output"

produces: [version-bump, changelog-entries, commits]
consumes: [code-changes]

context:
  default: null
  reason: "Version bump needs access to git state and changelog/version files"

when_to_skip:
  - "No version-worthy changes since last release"
  - "Release is handled externally"

workflow: wfi://release/bump-version

effort: light
tags: [git, versioning, release]

instructions: "Prepare version/changelog changes only. Do not publish gems, deploy, or create a release merely because delivery completes."
