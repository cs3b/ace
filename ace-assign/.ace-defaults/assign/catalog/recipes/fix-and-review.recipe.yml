name: fix-and-review
description: Fix an issue, verify tests, and create a reviewed PR

matches:
  - "fix * and review"
  - "bug fix with PR"
  - "fix issue *"

parameters:
  taskref: { required: true }

steps:
  - name: onboard
    required: true
  - name: work-on-task
    required: true
    instructions_template: "Fix the issue described in task {{taskref}}."
  - name: mark-task-done
    required: false
  - name: verify-test-suite
    required: true
  - name: create-pr
    required: true
    instructions_template: "Create the pull request with --draft; keep it draft until the review completion rule is met."
  - name: review-pr
    required: true
    workflow: wfi://review/pr
    note: "Iterate verified fixes and affected reviews until the round completion rule is met"
  - name: update-pr-desc
    required: true
  - name: mark-pr-ready
    required: true
    note: "Only after review completion rule"

customization_hints:
  - "Add fix-tests after verify-test-suite if failures found"
  - "Add security-audit for security-related fixes"
  - "Include integration scope when the fix crosses module boundaries"
