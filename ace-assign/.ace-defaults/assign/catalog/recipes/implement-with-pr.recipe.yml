name: implement-with-pr
description: Implement a task, create PR, and review until the current PR passes

matches:
  - "work on task * and create PR"
  - "implement * with review"
  - "full task workflow"

parameters:
  taskref: { required: true }

steps:
  - name: onboard
    required: true
  - name: plan-task
    required: false
    note: "JIT planning — can be skipped for trivial tasks"
  - name: work-on-task
    required: true
    instructions_template: "Work on task {{taskref}}."
  - name: reflect-and-refactor
    required: false
    note: "Architecture reflection — skip for trivial tasks"
  - name: mark-task-done
    required: false
  - name: release
    required: true
    note: "Initial version bump (usually minor)"
  - name: create-pr
    required: true
    instructions_template: "Create the pull request with --draft; keep it draft until the review completion rule is met."
  - name: reorganize-commits
    required: false
  - name: push-to-remote
    required: true
  - name: record-demo
    required: false
    note: "Record demos for modified packages with tapes; skip if no tapes or VHS unavailable"
  - name: review-pr
    required: true
    workflow: wfi://review/pr
    note: "Verify and fix findings; rerun affected scopes until a fresh integration review passes on the current head"
  - name: update-pr-desc
    required: true
  - name: mark-pr-ready
    required: true
    note: "Only after review completion rule and PR description update"

customization_hints:
  - "Skip onboard if already onboarded in a previous assignment"
  - "Add security-audit for security-sensitive changes"
  - "Use focused review scopes for simple changes; completion follows the shared round rule"
  - "Skip reorganize-commits if commit history is already clean"
  - "Skip record-demo if VHS is not available or no tape files exist"
