name: batch-tasks
description: Work on multiple tasks with PR, iterative review, and releases

matches:
  - "work on tasks *"
  - "batch implement *"
  - "multiple tasks"

parameters:
  taskrefs: { required: true, type: array }

steps:
  - name: onboard
    required: true
  - name: batch-parent
    required: true
    expansion:
      foreach: taskrefs
      child_step: work-on-task
      child_context: fork
    note: "Each child marks its task done after implementation"
  - name: release
    required: true
    note: "Initial version bump (usually minor)"
  - name: create-pr
    required: true
    instructions_template: "Create the pull request with --draft; keep it draft until the review completion rule is met."
  - name: reorganize-commits
    required: false
  - name: push-to-remote
    required: true
  - name: review-pr
    required: true
    workflow: wfi://review/pr
    note: "Apply verified fixes, release as needed, and rerun affected scopes using the shared round completion rule"
  - name: update-pr-desc
    required: true
  - name: mark-pr-ready
    required: true
    note: "Only after review completion rule and PR description update"

customization_hints:
  - "Add create-pr after batch for consolidated review"
  - "Use the iterative PR review workflow for all changed modules"
  - "Reduce batch size for complex tasks"
  - "Skip reorganize-commits if history is already clean"
