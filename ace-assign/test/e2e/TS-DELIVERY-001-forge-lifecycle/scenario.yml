test-id: TS-DELIVERY-001
title: "Installed forge-neutral lifecycle"
area: delivery
package: ace-assign
priority: high
timeout: 1800
cost-tier: deep
tags: [installed-acceptance, "use-case:delivery"]
tool-under-test: ace-assign
e2e-justification: >
  Requires the actual installed public CLI, disposable provider state or authenticated
  protected/native producer; deterministic fixtures cannot prove installed outcomes.
e2e-evidence-strength: state+content
unit-coverage-reviewed:
  - ace-assign/test/feat/delivery_coordinator_test.rb
  - ace-assign/test/feat/prepared_delivery_flow_test.rb
  - ace-git-worktree/test/feat/worktree_manager_contract_test.rb
  - ace-git/test/fast/providers/server_registry_test.rb
  - ace-git/test/fast/providers/taxonomy_test.rb
  - ace-review/test/fast/molecules/pr_provider_test.rb
  - ace-task/test/fast/molecules/issue_link_test.rb
  - ace-task/test/fast/molecules/issue_sync_adapter_test.rb
requires:
  tools: [ace-assign, ace-git, ace-git-worktree, ace-task, ace-review, ace-bundle, ace-overseer, ace-herdr, git]
  ruby: ">= 3.2"
setup:
  - run: 'test -n "$ACE_QKC_SCOPE_FILE" && test -r "$ACE_QKC_SCOPE_FILE" && cp "$ACE_QKC_SCOPE_FILE" scope.json'
