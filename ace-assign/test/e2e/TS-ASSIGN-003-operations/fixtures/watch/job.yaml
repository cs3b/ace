session:
  name: watch-sequential-operations
  description: Retained watcher continuation flow

steps:
  - name: delegated-alpha
    context: fork
    fork:
      mode: headless
      provider: codex:gpt-5.4-mini
    instructions: |
      Execute the first retained watcher subtree.
    sub_steps:
      - onboard
      - plan-task

  - name: delegated-beta
    context: fork
    fork:
      mode: headless
      provider: codex:gpt-5.4-mini
    instructions: |
      Execute the second retained watcher subtree.
    sub_steps:
      - work-on-task

  - name: manual-tail
    instructions: |
      Validate the queue state after watcher continuation stops.
