test-id: TS-B36TS-001
title: "ace-b36ts Public-Surface Goal Workflow"
area: timestamp
package: ace-b36ts
priority: high
tags: [smoke, happy-path, "use-case:b36ts", "goal-style"]
cost-tier: smoke
tool-under-test: ace-b36ts

e2e-justification: >
  This scenario validates public CLI workflows from usage/help paths: archive
  organization with generated tokens, decode roundtrip verification, and
  split/path/json output behavior used by maintainers.

unit-coverage-reviewed:
  - test/fast/commands/encode_command_test.rb
  - test/fast/commands/decode_command_test.rb
  - test/fast/atoms/split_encoder_test.rb
  - test/feat/cli_contract_test.rb

sandbox-layout:
  notes/inbox/: "Input notes provided to the agent"
  notes/archive/: "Reorganized notes with b36ts-prefixed names"
  results/tc/01/: "TC-001 archive workflow artifacts"
  results/tc/02/: "TC-002 decode roundtrip artifacts"
  results/tc/03/: "TC-003 split/path/json artifacts"

requires:
  tools: [ace-b36ts]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "cp $ACE_E2E_SOURCE_ROOT/mise.toml mise.toml && mise trust mise.toml"
  - write-file:
      path: notes/inbox/2026-03-17-release-notes.md
      content: "Release notes draft\n"
  - write-file:
      path: notes/inbox/2026-03-18-regression-log.md
      content: "Regression notes\n"
  - write-file:
      path: notes/inbox/2026-03-19-doc-plan.md
      content: "Doc update plan\n"
  - write-file:
      path: notes/inbox/2026-03-20-support-handoff.md
      content: "Support handoff context\n"
  - write-file:
      path: notes/inbox/2026-03-21-retro-points.md
      content: "Retro points\n"
