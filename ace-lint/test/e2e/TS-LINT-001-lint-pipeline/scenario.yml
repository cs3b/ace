test-id: TS-LINT-001
title: "ace-lint Goal-Based E2E"
area: lint
package: ace-lint
priority: high
tags: [smoke, happy-path, deep, "use-case:lint"]
cost-tier: smoke
tool-under-test: ace-lint

sandbox-layout:
  results/tc/01/:  "Help + docs public-surface map"
  results/tc/02/:  "Valid lint end-state artifacts and report evidence"
  results/tc/03/:  "Fix mode end-state artifacts (modified file, fixed evidence)"
  results/tc/04/:  "Syntax error artifacts (pending.md, exit code)"
  results/tc/05/:  "Batch integrated outcomes (passed/fixed/failed)"
  results/tc/06/:  "Configuration routing evidence from documented public path"
  results/tc/07/:  "Doctor diagnostics output (healthy vs malformed YAML)"
  results/tc/08/:  "--no-report public contract evidence"

e2e-justification: >
  All goals require the real ace-lint binary executing through a shell with
  deterministic scenario-local validator shims. Lint pipeline generates filesystem
  artifacts (report.json, markdown files). Fix mode modifies real files.
  Doctor mode inspects real tool availability and config files. None of
  this is testable with mocks.

unit-coverage-reviewed:
  - test/fast/lint_test.rb
  - test/fast/atoms/comment_validator_test.rb
  - test/fast/atoms/pattern_matcher_test.rb
  - test/fast/atoms/rubocop_runner_test.rb
  - test/fast/atoms/standardrb_runner_test.rb
  - test/fast/molecules/group_resolver_test.rb
  - test/fast/molecules/markdown_linter_test.rb
  - test/fast/molecules/ruby_linter_test.rb
  - test/fast/molecules/markdown_surgical_fixer_test.rb
  - test/fast/organisms/lint_orchestrator_test.rb
  - test/fast/organisms/lint_doctor_test.rb
  - test/fast/organisms/report_generator_test.rb
  - test/fast/commands/lint_command_test.rb

requires:
  tools: [ace-lint, jq]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "if [ -f \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" ]; then cp \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" mise.toml && mise trust mise.toml; fi"
  - copy-fixtures
  - run: |
      install -m 0755 bin/standardrb "$ACE_E2E_SANDBOX_RUNTIME_ROOT/bin/standardrb"
      install -m 0755 bin/rubocop "$ACE_E2E_SANDBOX_RUNTIME_ROOT/bin/rubocop"
