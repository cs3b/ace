test-id: TS-SECRETS-002
title: "ace-git-secrets Saved-Report Remediation Path"
area: git-secrets
package: ace-git-secrets
priority: high
tags: [smoke, remediation, "use-case:secrets"]
cost-tier: smoke
tool-under-test: ace-git-secrets

sandbox-layout:
  results/tc/01/:  "Saved-report remediation path evidence"

e2e-justification: >
  This flow validates the user-facing remediation contract across real CLI
  commands and persisted report artifacts. It must run against a real git
  repository with gitleaks and real file outputs under .ace-local.

unit-coverage-reviewed:
  - test/fast/commands/revoke_command_test.rb
  - test/fast/commands/rewrite_command_test.rb
  - test/fast/molecules/token_revoker_test.rb
  - test/fast/molecules/git_rewriter_test.rb
  - test/fast/models/scan_report_test.rb

requires:
  tools: [ace-git-secrets, git, gitleaks]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "cp ${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml mise.toml && mise trust mise.toml"
  - copy-fixtures
  - run: git add -A && git commit -m "initial" --quiet
  - agent-env:
      PROJECT_ROOT_PATH: .
