name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

jobs:
  package_inventory:
    name: Validate test package inventory
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.inventory.outputs.packages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Validate suite and publish matrix
        id: inventory
        run: |
          packages="$(ruby .ace-bin/ci_package_inventory.rb)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.package }} (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    needs: package_inventory

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        package: ${{ fromJSON(needs.package_inventory.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle install
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Run tests for ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "ace-monorepo-e2e" ]; then
            bundle exec ace-test-e2e ace-monorepo-e2e --dry-run
          else
            bundle exec ace-test "${{ matrix.package }}" all
          fi
        env:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package }}-ruby${{ matrix.ruby }}
          path: |
            .ace-local/test/reports/
            .ace-local/test-e2e/
          retention-days: 7

  projection_contract:
    name: Skill projection contract
    runs-on: ubuntu-latest
    needs: package_inventory

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Bundle install
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Run handbook projection contract tests
        run: bundle exec ace-test ace-handbook all
        env:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle

  # Summary job to ensure all tests passed
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [package_inventory, test, projection_contract]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.package_inventory.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.projection_contract.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed. Check the individual job logs for details."
            exit 1
          fi
