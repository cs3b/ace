test-id: TS-SIM-001
title: "ace-sim public-surface smoke"
area: sim
package: ace-sim
timeout: 900
priority: high
tags: [smoke, happy-path, "use-case:simulation"]
cost-tier: smoke
tool-under-test: ace-sim

sandbox-layout:
  results/tc/01/: "Help survey observations"
  results/tc/02/: "Default preset behavioral run evidence"
  results/tc/03/: "Explicit CLI override + one-step synthesis evidence"
  results/tc/05/: "Validate-task preset run contract evidence"

e2e-justification: >
  This scenario validates end-to-end CLI execution through public user journeys.
  Fast deterministic tests cover internals. E2E checks only user-visible outcomes and
  real recorded run artifacts, without synthetic placeholder pass paths.

requires:
  tools: [ace-sim, ace-llm, ace-bundle]

setup:
  - copy-fixtures
  - git-init
  - run: "cp ${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml mise.toml && mise trust mise.toml"
  - agent-env:
      PROJECT_ROOT_PATH: .
