test-id: TS-BUNDLE-001
title: "ace-bundle Public-Surface Goal E2E"
area: bundle
package: ace-bundle
priority: high
tags: [smoke, happy-path, "use-case:bundle"]
cost-tier: smoke
tool-under-test: ace-bundle

sandbox-layout:
  results/tc/01/:  "Help survey observations"
  results/tc/02/:  "Preset loading + file-pattern evidence"
  results/tc/04/:  "Output routing evidence (default routing + explicit --output)"
  results/tc/05/:  "CLI consistency and error semantics evidence"

e2e-justification: >
  All goals require the real ace-bundle binary executing through a shell.
  Preset loading and file-pattern behavior depend on real filesystem presets and
  pattern expansion. Output routing must be validated from user-visible CLI
  output behavior. Error semantics require real CLI execution on invalid input.
  None of this is testable with mocks.

requires:
  tools: [ace-bundle]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: |
      if [ -f "${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml" ]; then
        cp "${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml" mise.toml
        mise trust mise.toml
      fi
  - copy-fixtures
  - run: |
      # Generate large preset (over 500 lines)
      {
        printf '%s\n' '---' 'name: large-test' '---' '' '# Large Test Content' ''
        for i in $(seq 1 600); do echo "Line $i of large content"; done
      } > .ace/bundle/presets/large-test.md
  - run: |
      # Generate small preset (100 lines, below threshold)
      {
        printf '%s\n' '---' 'name: small-test' '---' '' '# Test Content' ''
        for i in $(seq 1 95); do echo "Line $i"; done
      } > .ace/bundle/presets/small-test.md
  - agent-env:
      PROJECT_ROOT_PATH: .
