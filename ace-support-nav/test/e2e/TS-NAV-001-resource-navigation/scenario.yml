test-id: TS-NAV-001
title: "ace-nav resource navigation smoke"
area: nav
package: ace-support-nav
priority: high
tags: [smoke, happy-path, "use-case:nav"]
cost-tier: smoke
tool-under-test: ace-nav

sandbox-layout:
  results/tc/01/: "Help survey observations + sources command captures"
  results/tc/02/: "Public resolve journey evidence (guide + workflow)"
  results/tc/03/: "Discovery-to-listing workflow evidence"
  results/tc/04/: "Error handling captures (missing resource, informative errors)"
  results/tc/06/: "Create-from-template public-path evidence"

e2e-justification: >
  These checks validate real CLI navigation and creation behavior through public
  command surfaces: discover commands via help/sources, resolve usable resource
  targets, browse actionable listings, create output artifacts, and verify
  graceful error handling. Deterministic parser/scanner/priority internals are
  covered in fast and feat tests; this scenario retains only full pipeline
  behavior that requires real command execution with fixtures.

unit-coverage-reviewed:
  - test/fast/commands/cli_test.rb
  - test/fast/atoms/extension_inferrer_test.rb
  - test/fast/atoms/uri_parser_test.rb
  - test/fast/molecules/protocol_scanner_test.rb
  - test/fast/molecules/source_registry_test.rb
  - test/fast/organisms/navigation_engine_test.rb
  - test/feat/task_protocol_test.rb

requires:
  tools: [ace-nav]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "if [ -f \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" ]; then cp \"${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml\" mise.toml && mise trust mise.toml; fi"
  - agent-env:
      PROJECT_ROOT_PATH: .
  - copy-fixtures
