name: openai
last_synced: 2026-04-23
class: Ace::LLM::Organisms::OpenAIClient
gem: ace-llm
context_limit: 128000
models:
  - gpt-5.1
  - gpt-5.1-chat-latest
  - gpt-5.1-codex
  - gpt-5.1-codex-max
  - gpt-5.1-codex-mini
  - gpt-5.2
  - gpt-5.2-chat-latest
  - gpt-5.2-pro
  - gpt-5.3-chat-latest
  - gpt-5.3-codex
  - gpt-5.3-codex-spark
  - gpt-5.4
  - gpt-5.4-mini
  - gpt-5.4-nano
  - gpt-5.4-pro
aliases:
  global:
    oagpt: openai:gpt
    oacodex: openai:codex
    oamax: openai:max
  model:
    gpt: gpt-5.4
    codex: gpt-5.3-codex
    max: gpt-5.1-codex-max
    mini: gpt-5.4-mini
    nano: gpt-5.4-nano
api_key:
  env: OPENAI_API_KEY
  required: true
  description: OpenAI API key
capabilities:
  - text_generation
  - streaming
  - function_calling
  - vision
  - embeddings
default_options:
  temperature: 0.7
  max_tokens: 16384
