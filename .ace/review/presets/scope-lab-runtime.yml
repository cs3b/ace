presets:
  - code-valid
description: "Lab runtime surface: assignment plans, local overseer, HITL event files, review, and terminal transports"
file_patterns:
  include:
    - "ace-lab/**"
    - "ace-lab/.ace-defaults/**"
    - "ace-herdr/**"
    - "ace-herdr/.ace-defaults/**"
    - "ace-runtime/**"
    - "ace-runtime/.ace-defaults/**"
    - "ace-review/**"
    - "ace-review/.ace-defaults/**"
    - "ace-assign/**"
    - "ace-assign/.ace-defaults/**"
    - "ace-overseer/**"
    - "ace-overseer/.ace-defaults/**"
    - "ace-hitl/**"
    - "ace-hitl/.ace-defaults/**"
    - "ace-hitl-contract/**"
    - "ace-hitl-hermes/**"
    - "Gemfile.lock"
    - "CHANGELOG.md"
