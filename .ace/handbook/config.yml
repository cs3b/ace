# Project handbook sync: neutral agents projection + pi provider.
# The pi provider projects pi assets (skills, prompts) and the ace-wake
# extension from the ace-wake asset package into .pi/. The ace-wake
# timers/watch are a local utility only: there is no cron, system daemon,
# or delivery-queue engine. pi continuation of already delegated work is
# planned (L7.3: not available yet).
# Other harness-native trees (.codex/skills, .claude/skills, etc.) stay disabled.
sync:
  providers:
    enabled:
      - agents
      - pi
    disabled:
      - claude
      - codex
      - gemini
      - opencode
