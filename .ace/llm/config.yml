# ace-llm configuration file
# Reviewer policy (Captain, 2026-10-02): reviews run ONE reviewer position
# with a fallback chain — pi glm 5.3 -> codex sol -> agy flash 3.8 — so the
# round is good if even one returns. gemini is removed everywhere (individual
# auth tier deprecated Google-side); one astra review per PR via review-astra.

llm:
  providers:
    active:
      - agy
      - opencode
      - pi
      - codex
      - claude
      - openrouter
      - zai
      - google
  roles:
    # --- Reusable candidate lists ---
    _utility: &utility
      - codex:sol
      - agy:gemini-3.8-flash-medium
      - claude:haiku
    _assign-worker: &assign-worker
      - codex:sol:medium@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:sonnet:medium@yolo

    # --- Diagnostic ---
    doctor:
      - codex:sol:low@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:haiku:low@yolo

    # --- Planning ---
    planner:
      - codex:sol:high@ro
      - pi:zai/glm-5.3@ro
      - claude:opus:high@ro

    # --- Review ---
    # Reviewer position with fallback chain: pi glm 5.3, then codex sol,
    # then agy flash 3.8 — the round is good if even one returns.
    review-default:
      - pi:zai/glm-5.3@ro
      - codex:sol@ro
      - agy:gemini-3.8-flash-medium@ro
    review-synthesizer:
      - codex:sol:low@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:sonnet:medium@ro
    review-codex:
      - codex:sol:high@ro
    # The single independent astra review for a PR (one session per PR)
    review-astra:
      - codex:astra@ro

    # --- Assignment ---
    assign-executor: *assign-worker
    assign-engineer: *assign-worker
    assign-orchestrator:
      - codex:sol:medium@yolo
      - pi:zai/glm-5.3@yolo
      - claude:opus:medium@yolo

    # --- E2E testing ---
    e2e-runner:
      - codex:sol:low@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:haiku:low@yolo
    e2e-verifier:
      - codex:sol:low@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku:low@ro
    e2e-reporter:
      - codex:sol:low@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku:low@ro

    # --- Utility ---
    prompt-enhance: *utility
    commit:
      - codex:sol
      - glite
    # *utility
    docs-analysis: *utility
    compressor: *utility
    idea-enhance:
      - codex:sol@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku@ro

    # --- Simulation ---
    sim-primary:
      - codex:sol@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku@ro
    sim-synthesis:
      - codex:sol:medium
      - pi:zai/glm-5.3
      - claude:opus:medium
  fallback:
    enabled: true
    retry_count: 2
    retry_delay: 1.0
    max_total_timeout: 60.0
    chains:
      glite: [zai:glm-4.7, openai:nano]
      cco: [codex, pi]
      codex: [pi]
    providers:
      - zai:glm-5
