# ace-llm configuration file
# Worker/reviewer policy (Captain, 2026-10-12, supersedes 2026-10-02 reviewer
# chain): worker default = pi zai/glm-5.3-flash:high; independent reviewer
# default = pi zai/glm-5.3:high. Codex is NOT a default and NOT a silent
# fallback — it runs only under an explicit Captain exception (retained
# explicit-exception presets: review-codex, review-astra). Selection
# precedence: Captain policy defaults > project launch overrides > explicit
# Captain exception. Every dispatch receipt records the ACTUAL harness,
# provider/model (incl. thinking level) and agent/pane/session — a documented
# default without a matching actual launch violates this policy.
# gemini is removed everywhere (individual auth tier deprecated Google-side);
# one astra review per PR via review-astra.

llm:
  providers:
    active:
      - agy
      - opencode
      - pi
      - codex
      - claude
      - openrouter
      - zai
      - google
  roles:
    # --- Reusable candidate lists ---
    _utility: &utility
      - pi:zai/glm-5.3-flash:high
      - agy:gemini-3.8-flash-medium
      - claude:haiku
    _assign-worker: &assign-worker
      - pi:zai/glm-5.3-flash:high@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:sonnet:medium@yolo

    # --- Diagnostic ---
    doctor:
      - pi:zai/glm-5.3-flash:high@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:haiku:low@yolo

    # --- Planning ---
    planner:
      - pi:zai/glm-5.3:high@ro
      - claude:opus:high@ro

    # --- Review ---
    # Reviewer default (Captain 2026-10-12): pi zai/glm-5.3:high. Non-codex
    # fallbacks only; codex requires an explicit Captain exception.
    review-default:
      - pi:zai/glm-5.3:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:sonnet:medium@ro
    review-synthesizer:
      - pi:zai/glm-5.3-flash:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:sonnet:medium@ro
    # EXPLICIT Captain-exception preset — never a default or silent fallback.
    review-codex:
      - codex:sol:high@ro
    # Reserved: the single independent astra review for a PR (one session
    # per PR), run explicitly by the delivery flow — not wired into presets.
    review-astra:
      - codex:astra@ro

    # --- Assignment ---
    assign-executor: *assign-worker
    assign-engineer: *assign-worker
    assign-orchestrator:
      - pi:zai/glm-5.3-flash:high@yolo
      - pi:zai/glm-5.3:high@yolo
      - claude:opus:medium@yolo

    # --- E2E testing ---
    e2e-runner:
      - pi:zai/glm-5.3-flash:high@yolo
      - agy:gemini-3.8-flash-medium@yolo
      - claude:haiku:low@yolo
    e2e-verifier:
      - pi:zai/glm-5.3:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku:low@ro
    e2e-reporter:
      - pi:zai/glm-5.3-flash:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku:low@ro

    # --- Utility ---
    prompt-enhance: *utility
    commit:
      - pi:zai/glm-5.3-flash:high
      - glite
    # *utility
    docs-analysis: *utility
    compressor: *utility
    idea-enhance:
      - pi:zai/glm-5.3-flash:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku@ro

    # --- Simulation ---
    sim-primary:
      - pi:zai/glm-5.3-flash:high@ro
      - agy:gemini-3.8-flash-medium@ro
      - claude:haiku@ro
    sim-synthesis:
      - pi:zai/glm-5.3:high
      - claude:opus:medium
  fallback:
    enabled: true
    retry_count: 2
    retry_delay: 1.0
    max_total_timeout: 60.0
    chains:
      glite: [zai:glm-4.7, openai:nano]
      cco: [codex, pi]
      codex: [pi]
    providers:
      - zai:glm-5
