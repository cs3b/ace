test-id: TS-TASK-002
title: "ace-task Auxiliary CLI Journeys E2E"
area: task
package: ace-task
priority: medium
tags: [auxiliary, public-surface, "use-case:task"]
cost-tier: focused
tool-under-test: ace-task

sandbox-layout:
  results/tc/01/: "Status dashboard journey evidence"
  results/tc/02/: "Plan path/cache-refresh journey evidence"

e2e-justification: >
  These goals validate end-to-end CLI behavior that depends on real filesystem
  state and persisted plan artifacts. Fast tests cover command internals but do
  not fully validate operator-facing path mode and status dashboard behavior.

unit-coverage-reviewed:
  - test/fast/commands/status_command_test.rb
  - test/fast/commands/plan_test.rb

requires:
  tools: [ace-task, git]
  ruby: ">= 3.0"

setup:
  - git-init
  - run: "cp ${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml mise.toml && mise trust mise.toml"
  - run: git add -A && git commit -m "initial" --quiet
