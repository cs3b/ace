# ace-task default configuration
task:
  # Root directory for task storage
  root_dir: .ace-tasks

  # Default status for new tasks
  default_status: pending

  # File pattern for task spec files
  file_pattern: "*.s.md"

  # Prefix used to identify special folders (e.g., "_archive", "_backlog")
  special_folder_prefix: "_"

  # Named task stores selected with `--in NAME`. Paths are relative to the
  # project root (or absolute). A store is its own manager root: it is not
  # scanned by the project task list and may live outside root_dir.
  # `_overseer` is the private, untracked task list owned by one overseer.
  stores:
    _overseer: .ace-local/overseer/tasks

  # Status command: default limits
  status:
    up_next_limit: 3
    recently_done_limit: 9

  # Doctor command: LLM model for agent-assisted fix
  doctor_agent_model: "role:doctor"

  # Plan command defaults
  plan:
    model: "role:planner"
