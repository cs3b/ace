test-id: TS-OVERSEER-002
title: "ace-overseer Status and Operations E2E"
area: overseer
package: ace-overseer
priority: medium
timeout: 900
tags: [smoke, ops, "use-case:overseer"]
cost-tier: happy-path
tool-under-test: ace-overseer

sandbox-layout:
  results/tc/06/: "Status watch-refresh evidence"
  results/tc/07/: "Multi-task work-on bundle evidence"

e2e-justification: >
  These goals validate public operations behavior that depends on real CLI execution,
  worktree state, and overseer status refresh output. They are orchestration outcomes,
  not isolated unit-level contracts.

unit-coverage-reviewed:
  - test/fast/commands/status_command_test.rb
  - test/fast/commands/work_on_command_test.rb
  - test/fast/organisms/status_collector_test.rb
  - test/fast/organisms/work_on_orchestrator_test.rb

requires:
  tools: [ace-overseer, ace-git-worktree, ace-tmux, ace-assign, ace-task, git, tmux]
  ruby: ">= 3.0"

setup:
  - git-init
  - tmux-session
  - run: "cp ${ACE_E2E_SOURCE_ROOT:-$PROJECT_ROOT_PATH}/mise.toml mise.toml && mise trust mise.toml"
  - copy-fixtures
  - run: git add -A && git commit -m "initial" --quiet
  - agent-env:
      PROJECT_ROOT_PATH: .
