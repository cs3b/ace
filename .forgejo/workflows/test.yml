name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    name: Complete package suite
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:3.4

    steps:
      - name: Checkout exact revision
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          FORGEJO_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          server_url="${GITHUB_SERVER_URL:-http://forgejo:3000}"
          repo="${GITHUB_REPOSITORY:-cs3b/ace}"
          host_path="${server_url#http://}"
          host_path="${host_path#https://}"
          proto=http
          if [[ "$server_url" =~ ^https:// ]]; then proto=https; fi
          git remote add origin "${proto}://x-access-token:${FORGEJO_TOKEN}@${host_path}/${repo}.git"
          git fetch --depth 1 origin "$FORGEJO_SHA"
          git checkout --force "$FORGEJO_SHA"
          git remote set-url origin "${proto}://${host_path}/${repo}.git"
          if git config --get remote.origin.url | grep -q x-access-token; then
            echo "ERROR: Token detected in git remote URL" >&2
            exit 1
          fi

      - name: Install system test tools once
        run: |
          set -euo pipefail
          apt-get update -qq
          # Forgejo executes JavaScript actions inside the job container. Keep
          # Node available before actions/cache runs; the upstream ruby image
          # intentionally does not ship it.
          apt-get install -y -qq curl fd-find git-filter-repo nodejs procps ripgrep time tmux
          if command -v fdfind >/dev/null 2>&1; then
            ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi

          GITLEAKS_VERSION=8.18.2
          GITLEAKS_SHA256=6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball"
          chmod 0755 /usr/local/bin/gitleaks

      - name: Validate package inventory
        run: |
          set -euo pipefail
          ruby .ace-bin/ci_package_inventory.rb > forgejo-package-inventory.json
          cat forgejo-package-inventory.json

      - name: Resolve dependency identity and trust scope
        id: dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ruby_identity="$(ruby -rrbconfig -e \
            'print [RUBY_ENGINE, RUBY_VERSION, RbConfig::CONFIG["ruby_version"], RUBY_PLATFORM, RbConfig::CONFIG["arch"]].join(":")')"
          lock_sha="$(sha256sum Gemfile.lock | cut -d' ' -f1)"
          image='docker.io/library/ruby:3.4'
          fingerprint="$(printf '%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$lock_sha" "$ruby_identity" "$image" | sha256sum | cut -d' ' -f1)"
          if [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/heads/main ]]; then
            scope=main
            main_restore_key=''
          else
            untrusted="${HEAD_REF:-${ACTOR:-unknown}}"
            untrusted="$(printf '%s' "$untrusted" | tr -cs 'A-Za-z0-9._-' '-')"
            scope="pr-${untrusted:0:80}"
            main_restore_key="ace-bundle-v3-${fingerprint}-main"
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "cache_key=ace-bundle-v3-${fingerprint}-${scope}" >> "$GITHUB_OUTPUT"
          echo "main_restore_key=$main_restore_key" >> "$GITHUB_OUTPUT"

      - name: Restore exact compatible bundle
        id: bundle-cache
        uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ steps.dependencies.outputs.cache_key }}
          restore-keys: ${{ steps.dependencies.outputs.main_restore_key }}

      - name: Prepare dependencies at most once
        id: bundle
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_PATH: vendor/bundle
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          DEPENDENCY_SCOPE: ${{ steps.dependencies.outputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p .ace-local/ci
          if bundle check >.ace-local/ci/bundle-check.txt 2>&1; then
            outcome=warm
          else
            outcome=cold-owner
            if [[ -d vendor/bundle ]]; then outcome=invalidated; fi
            rm -rf vendor/bundle
            mkdir -p vendor/bundle
            /usr/bin/time -f 'wall=%e user=%U system=%S max_rss_kb=%M' \
              -o .ace-local/ci/bundle-time.txt \
              bundle install --jobs 4 --retry 3
            bundle check >.ace-local/ci/bundle-check.txt
          fi
          bundle list >.ace-local/ci/bundle-list.txt
          resolved_sha="$(sha256sum .ace-local/ci/bundle-list.txt | cut -d' ' -f1)"
          printf 'outcome=%s\nfingerprint=%s\nscope=%s\nresolved_sha256=%s\n' \
            "$outcome" "$DEPENDENCY_FINGERPRINT" "$DEPENDENCY_SCOPE" "$resolved_sha" \
            | tee .ace-local/ci/dependencies.txt
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Run complete deterministic suite
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_PATH: vendor/bundle
          PROJECT_ROOT_PATH: ${{ github.workspace }}
          RAILS_ENV: test
        run: |
          set -euo pipefail
          # The shared runner has three execution slots. More package
          # processes increase contention and can trip valid 30s package
          # timeouts without reducing useful wall time.
          /usr/bin/time -f 'wall=%e user=%U system=%S max_rss_kb=%M' \
            -o .ace-local/ci/suite-time.txt \
            bundle exec ace-test-suite --no-color --parallel 3 --target all 2>&1 \
              | tee .ace-local/ci/suite.log

      - name: Verify monorepo E2E discovery
        if: always()
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_PATH: vendor/bundle
          PROJECT_ROOT_PATH: ${{ github.workspace }}
        run: bundle exec ace-test-e2e ace-monorepo-e2e --dry-run

      - name: Verify handbook projection contract
        if: always()
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_PATH: vendor/bundle
          PROJECT_ROOT_PATH: ${{ github.workspace }}
          RAILS_ENV: test
        run: bundle exec ace-test ace-handbook all

      - name: Publish run summary
        if: always()
        env:
          OUTCOME: ${{ steps.bundle.outputs.outcome }}
          FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          SCOPE: ${{ steps.dependencies.outputs.scope }}
        run: |
          {
            echo '## ACE test environment'
            echo
            echo "- Dependencies: ${OUTCOME:-not-prepared}"
            echo "- Fingerprint: ${FINGERPRINT:0:12}"
            echo "- Trust scope: ${SCOPE:-unknown}"
            echo '- Topology: one complete-suite environment'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain package-level reports
        if: always()
        # Forgejo's artifact service supports v3 and its patched v4 action;
        # upstream GitHub upload-artifact@v4 targets a different protocol.
        uses: actions/upload-artifact@v3
        with:
          name: ace-test-evidence-${{ github.sha }}
          path: |
            .ace-local/ci/
            .ace-local/test/reports/
            .ace-local/test-e2e/
            forgejo-package-inventory.json
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [suite]
    if: always()

    steps:
      - name: Check complete suite result
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          if [[ "$SUITE_RESULT" == success ]]; then
            echo "All ACE package, inventory, E2E discovery, and projection checks passed."
            exit 0
          fi
          echo "ACE suite failed. Inspect the package-level report artifact and suite log." >&2
          exit 1
