name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:3.4

    steps:
      - name: Checkout code
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          FORGEJO_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          server_url="${GITHUB_SERVER_URL:-http://forgejo:3000}"
          repo="${GITHUB_REPOSITORY:-cs3b/ace}"
          host_path="${server_url#http://}"
          host_path="${host_path#https://}"
          proto="http"
          if [[ "$server_url" =~ ^https:// ]]; then proto="https"; fi

          git remote add origin "${proto}://x-access-token:${FORGEJO_TOKEN}@${host_path}/${repo}.git"
          git fetch --depth 1 origin "$FORGEJO_SHA"
          git checkout --force "$FORGEJO_SHA"

          git remote set-url origin "${proto}://${host_path}/${repo}.git"
          if git config --get remote.origin.url | grep -q "x-access-token"; then
            echo "ERROR: Token detected in git remote URL" >&2
            exit 1
          fi

          git log -1 --oneline

      - name: Bundle install
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Validate test package inventory
        run: |
          ruby .ace-bin/ci_package_inventory.rb

      - name: Run ACE test suite
        run: |
          export PATH="$PWD/bin:$PATH"
          bundle exec bin/ace-test-suite --target all
        env:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle

      - name: Run handbook projection contract
        run: |
          export PATH="$PWD/bin:$PATH"
          bundle exec bin/ace-test ace-handbook all
        env:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle

      - name: Run monorepo E2E dry-run
        run: |
          export PATH="$PWD/bin:$PATH"
          bundle exec bin/ace-test-e2e ace-monorepo-e2e --dry-run
        env:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle
