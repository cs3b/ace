# Default workspace preset: a work tab with a shell and a pi agent side by
# side, plus a scratch shell tab.
#
# Override in ~/.ace/herdr/workspaces/ or .ace/herdr/workspaces/
# (project wins; see ace-herdr docs/usage.md for the full schema).
label: development
focus: true
tabs:
  - label: work
    panes:
      - label: shell
      - label: agent
        agent:
          kind: pi
          name: development-agent
          prompt: Ready to work on the current task.
    splits:
      - direction: right
        target: shell
        pane: agent
  - label: scratch
    panes:
      - label: shell
